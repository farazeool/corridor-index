name: Re-run the thesis

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch every source
        run: npm run fetch
      - name: Rebuild the thesis
        run: npm run thesis
      - run: npm test
      - name: Commit new data
        run: |
          git config user.name "corridor-index-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "Data: daily re-run $(date -u +%F)"
          git push
